[project]
name = "devops-audit-agent"
version = "1.0.0"
description = "LLM-driven agent that audits GitHub repositories for DevOps best-practice violations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # subprocess calls are deliberate and use argument lists, never a shell

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"eval/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
